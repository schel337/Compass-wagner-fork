# Test pipeline (see TESTING_PLAN.md):
#
#   fast (every PR/push): unit + micro-model tiers. No license required:
#     LP tests run on HiGHS (highspy) and skip Gurobi when unlicensed.
#
#   nightly (schedule): the slow integration tier (full pipeline on the
#     SubModel_cc central-carbon submodel + synthetic NB expression data)
#     plus the fast tier with Gurobi. If the Gurobi WLS secrets are set,
#     a license is activated first, so the Gurobi solver is exercised too
#     (the optimizer tests are parametrized over both solvers, making this
#     a cross-solver parity check).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "30 2 * * *"

jobs:
  fast-tests:
    name: Fast tests (HiGHS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
      - name: Run fast tests
        run: pytest -m "not slow" -q

  nightly:
    name: Nightly (integration + Gurobi parity)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
      - name: Activate Gurobi WLS license (if configured)
        if: ${{ secrets.GUROBI_WLS_ACCESSID != '' }}
        env:
          WLS_ACCESSID: ${{ secrets.GUROBI_WLS_ACCESSID }}
          WLS_SECRET: ${{ secrets.GUROBI_WLS_SECRET }}
          WLS_LICENSEID: ${{ secrets.GUROBI_WLS_LICENSEID }}
        run: |
          python - <<'EOF'
          import os
          with open("gurobi.lic", "w") as f:
              f.write("WLSACCESSID=%s\n" % os.environ["WLS_ACCESSID"])
              f.write("WLSSECRET=%s\n" % os.environ["WLS_SECRET"])
              f.write("LICENSEID=%s\n" % os.environ["WLS_LICENSEID"])
          # Activation happens on first gurobipy import (needs network)
          import gurobipy as gp
          m = gp.Model()
          m.addVar(lb=0.0, ub=1.0)
          m.setObjective(m.getVars()[0], gp.GRB.MAXIMIZE)
          m.optimize()
          assert m.status == gp.GRB.OPTIMAL
          print("Gurobi WLS license active")
          EOF
      - name: Copy license where compass/main.py looks for it
        if: ${{ secrets.GUROBI_WLS_ACCESSID != '' }}
        run: cp gurobi.lic compass/gurobi.lic
      - name: Run integration tests
        run: pytest -m slow -q
      - name: Run fast tests (Gurobi available if licensed)
        run: pytest -m "not slow" -q
